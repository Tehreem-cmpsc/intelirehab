name: inteli_rehab_mobile_app
description: Inteli Rehab patient app — registration, login, and rehab session tracking.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.6.0
  cupertino_icons: ^1.0.8
  # Renders the Home dashboard's 3D arm model (assets/models/arm_anatomy.glb).
  # Embeds Google's <model-viewer> in a WebView; on Android/iOS its JS is a
  # bundled package asset, not loaded from a CDN, so — same as the glb —
  # it renders fully offline.
  model_viewer_plus: ^1.10.0
  # The digital-twin page (assets/twin/) runs in a WebView we control directly;
  # already pulled in by model_viewer_plus, now a direct dependency.
  webview_flutter: ^4.14.1
  # Real BLE central for the arm band (firmware/lib/BLEStreamer.cpp's GATT
  # service) — see lib/features/home/ble/.
  flutter_blue_plus: ^2.3.13
  # Runtime BLUETOOTH_SCAN/BLUETOOTH_CONNECT (Android 12+) and location
  # (Android <12, required by the OS for BLE scanning even though this app
  # never reads it) permission requests.
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generates the launcher icons from assets/icon/app_icon.png (see
  # tool/generate_app_icon.dart for how that PNG is produced) — a
  # dev-only tool, not shipped in the app itself.
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/models/arm_anatomy.glb
    - assets/models/Arm_L.gltf
    - assets/models/Arm_L.bin
    - assets/models/Arm_R.gltf
    - assets/models/Arm_R.bin
    # Digital-twin WebView page + bundled Three.js (see tool/twin_bundle/).
    - assets/twin/
    # One short looping illustration per exercise (exercises.media_url).
    # Generated by Intelli_Rehab_Web_Portal/scripts/generate_exercise_illustrations.py.
    - assets/exercises/

# Run `dart run flutter_launcher_icons` after regenerating app_icon.png
# (tool/generate_app_icon.dart) to rebuild every platform's icon files.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#E4FAF6"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
