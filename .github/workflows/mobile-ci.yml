name: Mobile app CI

# Checks the Flutter app and builds an installable Android APK.
# After a run: GitHub -> Actions -> pick the run -> Artifacts -> "inteli-rehab-apk".
# Run it by hand any time from the Actions tab ("Run workflow").
on:
  push:
    paths: ["Inteli_Rehab_Mobile_App/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    paths: ["Inteli_Rehab_Mobile_App/**", ".github/workflows/mobile-ci.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Inteli_Rehab_Mobile_App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Signed with the debug key unless android/key.properties exists (see
      # android/key.properties.example): fine for testing and sharing with
      # testers, but not for publishing to the Play Store.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: inteli-rehab-apk
          path: Inteli_Rehab_Mobile_App/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
